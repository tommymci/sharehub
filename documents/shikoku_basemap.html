  body { margin: 0; background: #f5f5f5; overflow: hidden; height: 100vh; }
  .map-container { width: 100vw; height: 100vh; cursor: grab; }

  svg { width: 100%; height: 100%; }
  .controls { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 6px; z-index: 10; }
  .controls button { width: 40px; height: 40px; border: none; border-radius: 8px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.15); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .controls button:hover { background: #eee; }
  .hint { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); color: white; padding: 6px 16px; border-radius: 20px; font-size: 13px; z-index: 10; pointer-events: none; opacity: 1; transition: opacity 1s; }
  .hint.hide { opacity: 0; }

<script>
const svg = document.getElementById('mapSvg');
const container = document.getElementById('mapContainer');
const hint = document.getElementById('hint');

const initial = { x: 195, y: 625, w: 235, h: 260 };
let vb = { ...initial };
let isPanning = false, startX, startY, startVb;

function setViewBox() {
  svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
}

function zoomAt(factor, cx, cy) {
  const svgRect = svg.getBoundingClientRect();
  const px = (cx - svgRect.left) / svgRect.width;
  const py = (cy - svgRect.top) / svgRect.height;
  const newW = vb.w * factor;
  const newH = vb.h * factor;
  vb.x += (vb.w - newW) * px;
  vb.y += (vb.h - newH) * py;
  vb.w = newW;
  vb.h = newH;
  setViewBox();
}

function zoomIn() { zoomAt(0.75, window.innerWidth / 2, window.innerHeight / 2); }
function zoomOut() { zoomAt(1.333, window.innerWidth / 2, window.innerHeight / 2); }
function resetView() { vb = { ...initial }; setViewBox(); }

container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 1.1 : 0.9;
  zoomAt(factor, e.clientX, e.clientY);
}, { passive: false });

container.addEventListener('pointerdown', (e) => {
  isPanning = true;
  startX = e.clientX;
  startY = e.clientY;
  startVb = { ...vb };
  container.classList.add('grabbing');
  container.setPointerCapture(e.pointerId);
});

container.addEventListener('pointermove', (e) => {
  if (!isPanning) return;
  const svgRect = svg.getBoundingClientRect();
  const dx = (e.clientX - startX) / svgRect.width * startVb.w;
  const dy = (e.clientY - startY) / svgRect.height * startVb.h;
  vb.x = startVb.x - dx;
  vb.y = startVb.y - dy;
  setViewBox();
});

container.addEventListener('pointerup', () => {
  isPanning = false;
  container.classList.remove('grabbing');
});

setTimeout(() => hint.classList.add('hide'), 3000);
</script>
