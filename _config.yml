# Jekyll Configuration for GitHub Pages
title: Share Hub
description: Secure Document Sharing Portal
baseurl: "" # Custom domain: tommy.mcai.dev (no path prefix needed)
url: "https://tommy.mcai.dev"

# Build settings
markdown: kramdown
# theme: minima  # Commented out - using custom layouts instead
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Include HTML files without frontmatter
include:
  - "_*"
  
# Keep HTML files during processing (treat as static)
keep_files:
  - "documents"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Default layout for all documents
defaults:
  - scope:
      path: ""
    values:
      layout: "universal"
  - scope:
      path: "documents"
    values:
      permalink: /documents/:basename:output_ext
